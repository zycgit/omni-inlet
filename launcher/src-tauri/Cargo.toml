[package]
name = "omni-inlet-launcher"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "OmniInlet desktop launcher"

[lib]
name = "omni_inlet_launcher"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "omni-inlet"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0"
capture-protocol = { path = "../../capture-agent/crates/capture-protocol" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libdbus-sys = { version = "0.2", features = ["vendored"] }

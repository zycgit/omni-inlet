name: Build portable apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
          - runner: macos-latest
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: capture-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select stable Rust
        run: rustup default stable

      - name: Test workspace
        run: cargo xtask test

      - name: Build portable app
        run: cargo xtask package --target current

      - name: Create ZIP on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes zip
          mkdir -p "$GITHUB_WORKSPACE/release"
          archive="omni-inlet-${RELEASE_TAG}-${PLATFORM}-${ARCH}.zip"
          version="${RELEASE_TAG#v}"
          cd "dist/${version}/${TARGET}"
          zip -r "$GITHUB_WORKSPACE/release/$archive" app

      - name: Create ZIP on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release"
          archive="omni-inlet-${RELEASE_TAG}-${PLATFORM}-${ARCH}.zip"
          version="${RELEASE_TAG#v}"
          cd "dist/${version}/${TARGET}"
          ditto -c -k --keepParent app "$GITHUB_WORKSPACE/release/$archive"

      - name: Create ZIP on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE "release"
          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null
          $archive = "omni-inlet-$env:RELEASE_TAG-$env:PLATFORM-$env:ARCH.zip"
          $version = $env:RELEASE_TAG.TrimStart("v")
          $appDirectory = Join-Path (Get-Location) "dist/$version/$env:TARGET/app"
          Compress-Archive -Path $appDirectory -DestinationPath (Join-Path $releaseDirectory $archive)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Upload GitHub Release attachments
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all portable ZIP files
        uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: release
          merge-multiple: true

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "OmniInlet $RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/*.zip --clobber

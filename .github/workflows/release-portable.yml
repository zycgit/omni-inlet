name: Build portable apps

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag, for example v0.2.0"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            vcpkg_triplet: x64-linux-dynamic
            executable_suffix: ''
          - runner: windows-latest
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            vcpkg_triplet: x64-windows
            executable_suffix: '.exe'
          - runner: macos-26
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            vcpkg_triplet: arm64-osx-dynamic
            executable_suffix: ''

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: capture-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libclang-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            nasm \
            pkg-config \
            wget

      - name: Select Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Select stable Rust
        run: rustup default stable

      - name: Configure bundled native libraries
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          vcpkg_root="${VCPKG_INSTALLATION_ROOT:-/usr/local/share/vcpkg}"
          command -v vcpkg >/dev/null
          git -C "$vcpkg_root" fetch --depth=1 origin \
            39344dff01c5a5a0134caf2624cdd492f05d30ea
          echo "VCPKG_ROOT=$vcpkg_root" >> "$GITHUB_ENV"
          echo "OMNI_VCPKG_ROOT=$vcpkg_root" >> "$GITHUB_ENV"

      - name: Build bundled FFmpeg libraries
        shell: bash
        working-directory: .
        env:
          VCPKG_TRIPLET: ${{ matrix.vcpkg_triplet }}
        run: |
          set -euo pipefail
          vcpkg install \
            --x-manifest-root="$GITHUB_WORKSPACE/capture-agent" \
            --x-install-root="$OMNI_VCPKG_ROOT/installed" \
            --triplet="$VCPKG_TRIPLET" \
            --overlay-triplets="$GITHUB_WORKSPACE/capture-agent/vcpkg-triplets"

      - name: Test workspace
        run: cargo xtask test

      - name: Build portable app
        run: cargo xtask package --target current

      - name: Test bundled FFmpeg libraries
        shell: bash
        working-directory: .
        env:
          TARGET: ${{ matrix.target }}
          EXE_SUFFIX: ${{ matrix.executable_suffix }}
        run: |
          set -euo pipefail
          app="capture-agent/dist/0.2.0/${TARGET}/app"
          agent="$app/bin/capture-agent${EXE_SUFFIX}"
          output="$PWD/capture-agent/target/ci-ffmpeg-test"
          "$agent" doctor
          "$agent" run \
            --source test-pattern \
            --segments 1 \
            --segment-seconds 1 \
            --fps 5 \
            --job-id ci-ffmpeg-test \
            --output "$output"
          test -s "$output/videos/00000001.mkv"

      - name: Install launcher dependencies
        working-directory: launcher
        run: npm ci

      - name: Build launcher frontend
        working-directory: launcher
        run: npm run build

      - name: Build Tauri launcher on Linux and Windows
        if: runner.os != 'macOS'
        working-directory: launcher
        run: npm run tauri build -- --no-bundle

      - name: Build macOS application bundle
        if: runner.os == 'macOS'
        working-directory: launcher
        run: npm run tauri build -- --bundles app

      - name: Add launcher to portable app on Linux
        if: runner.os == 'Linux'
        shell: bash
        working-directory: .
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cp launcher/src-tauri/target/release/omni-inlet \
            "capture-agent/dist/0.2.0/${TARGET}/app/omni-inlet"

      - name: Assemble and sign macOS application bundle
        if: runner.os == 'macOS'
        shell: bash
        working-directory: .
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          portable="capture-agent/dist/0.2.0/${TARGET}/app"
          bundle="launcher/src-tauri/target/release/bundle/macos/OmniInlet.app"
          mkdir -p "$bundle/Contents/MacOS/bin"
          cp "$portable/bin/omni-inlet" "$bundle/Contents/MacOS/bin/omni-inlet"
          cp "$portable/bin/capture-agent" "$bundle/Contents/MacOS/bin/capture-agent"
          cp "$portable/bin/window-enumerator" "$bundle/Contents/MacOS/bin/window-enumerator"
          mkdir -p "$bundle/Contents/lib" "$bundle/Contents/licenses"
          cp -R "$portable/lib/." "$bundle/Contents/lib/"
          cp -R "$portable/licenses/." "$bundle/Contents/licenses/"
          mkdir -p "$bundle/Contents/Frameworks"
          xcrun swift-stdlib-tool --copy \
            --scan-executable "$bundle/Contents/MacOS/omni-inlet" \
            --scan-executable "$bundle/Contents/MacOS/bin/omni-inlet" \
            --scan-executable "$bundle/Contents/MacOS/bin/capture-agent" \
            --scan-executable "$bundle/Contents/MacOS/bin/window-enumerator" \
            --destination "$bundle/Contents/Frameworks" \
            --platform macosx
          find "$bundle/Contents/Frameworks" -type f -name '*.dylib' -exec codesign --force --sign - {} \;
          find "$bundle/Contents/lib" -type f -name '*.dylib' -exec codesign --force --sign - {} \;
          codesign --force --sign - "$bundle/Contents/MacOS/bin/omni-inlet"
          codesign --force --sign - "$bundle/Contents/MacOS/bin/capture-agent"
          codesign --force --sign - "$bundle/Contents/MacOS/bin/window-enumerator"
          codesign --force --sign - "$bundle"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          rm -rf "$portable/bin" "$portable/lib" "$portable/resources"
          cp -R "$bundle" "$portable/OmniInlet.app"

      - name: Add launcher to portable app on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        env:
          TARGET: ${{ matrix.target }}
        run: |
          Copy-Item `
            "launcher/src-tauri/target/release/omni-inlet.exe" `
            "capture-agent/dist/0.2.0/$env:TARGET/app/omni-inlet.exe"

      - name: Create ZIP on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes zip
          mkdir -p "$GITHUB_WORKSPACE/release"
          label="${RELEASE_TAG:-ci-${GITHUB_SHA:0:8}}"
          archive="omni-inlet-${label}-${PLATFORM}-${ARCH}.zip"
          version="0.2.0"
          cd "dist/${version}/${TARGET}"
          zip -r "$GITHUB_WORKSPACE/release/$archive" app

      - name: Create ZIP on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/release"
          label="${RELEASE_TAG:-ci-${GITHUB_SHA:0:8}}"
          archive="omni-inlet-${label}-${PLATFORM}-${ARCH}.zip"
          version="0.2.0"
          cd "dist/${version}/${TARGET}"
          ditto -c -k --keepParent app "$GITHUB_WORKSPACE/release/$archive"

      - name: Create ZIP on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE "release"
          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null
          $label = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { "ci-$($env:GITHUB_SHA.Substring(0, 8))" }
          $archive = "omni-inlet-$label-$env:PLATFORM-$env:ARCH.zip"
          $version = "0.2.0"
          $appDirectory = Join-Path (Get-Location) "dist/$version/$env:TARGET/app"
          Compress-Archive -Path $appDirectory -DestinationPath (Join-Path $releaseDirectory $archive)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Upload GitHub Release attachments
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all portable ZIP files
        uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: release
          merge-multiple: true

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "OmniInlet $RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/*.zip --clobber

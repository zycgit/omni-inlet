[package]
name = "capture-shells"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
autobins = false
description = "OmniInlet capture command shells"

[package.metadata.winresource]
ProductName = "OmniInlet"
FileDescription = "OmniInlet capture command"
CompanyName = "OmniInlet contributors"
LegalCopyright = "Copyright 2026 OmniInlet contributors"

[dependencies]
anyhow.workspace = true
clap.workspace = true
libloading.workspace = true

[build-dependencies]
winresource = "0.1.31"

[[bin]]
name = "capture-agent"
path = "src/bin/capture-agent.rs"

[[bin]]
name = "window-enumerator"
path = "src/bin/window-enumerator.rs"

[[bin]]
name = "omni-inlet"
path = "src/bin/omni-inlet.rs"

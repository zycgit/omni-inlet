[workspace]
members = [
    "crates/capture-protocol",
    "crates/capture-worker",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
x11rb = "0.13"
image = { version = "0.25", default-features = false, features = ["png"] }
openh264 = "0.9.7"
oxideav-core = "0.1.34"
oxideav-mkv = "0.0.9"
windows = "0.61"
screencapturekit = { version = "8", features = ["macos_14_0"] }

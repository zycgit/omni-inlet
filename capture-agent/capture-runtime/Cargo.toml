[package]
name = "capture-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "OmniInlet native capture runtime"

[package.metadata.winresource]
ProductName = "OmniInlet"
FileDescription = "OmniInlet native capture runtime"
CompanyName = "OmniInlet contributors"
LegalCopyright = "Copyright 2026 OmniInlet contributors"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow.workspace = true
capture-agent = { path = "../crates/capture-worker" }
rusty_ffmpeg = { version = "0.17.0", features = [
    "ffmpeg8_1",
    "link_vcpkg_ffmpeg",
    "use_prebuilt_binding",
] }

[build-dependencies]
winresource = "0.1.31"
